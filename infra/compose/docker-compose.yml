services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: memeradar
      POSTGRES_USER: memeradar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memeradar_local_only}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memeradar -d memeradar"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-56379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      DATABASE_URL: ${DATABASE_URL:-postgresql://memeradar:${POSTGRES_PASSWORD:-memeradar_local_only}@postgres:5432/memeradar}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REQUIRE_DATABASE_FOR_READINESS: ${REQUIRE_DATABASE_FOR_READINESS:-true}
      REQUIRE_REDIS_FOR_READINESS: ${REQUIRE_REDIS_FOR_READINESS:-true}
      ENABLED_CHAINS: ${ENABLED_CHAINS:-solana,robinhood}
      BNB_RPC_URL: ${BNB_RPC_URL:-}
      BNB_RPC_FALLBACK_URL: ${BNB_RPC_FALLBACK_URL:-}
      BNB_CHAIN_ID: ${BNB_CHAIN_ID:-56}
      ROBINHOOD_RPC_URL: ${ROBINHOOD_RPC_URL:-https://rpc.mainnet.chain.robinhood.com}
      ROBINHOOD_RPC_FALLBACK_URL: ${ROBINHOOD_RPC_FALLBACK_URL:-}
      ROBINHOOD_CHAIN_ID: ${ROBINHOOD_CHAIN_ID:-4663}
      VIEWER_API_TOKEN: ${VIEWER_API_TOKEN:-}
      OPERATOR_API_TOKEN: ${OPERATOR_API_TOKEN:-}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.mainnet.solana.com}
      HELIUS_RPC_URL: ${HELIUS_RPC_URL:-}
      HELIUS_API_KEY: ${HELIUS_API_KEY:-}
      MEMERADAR_SOLANA_STREAM_URL: ${MEMERADAR_SOLANA_STREAM_URL:-}
      MEMERADAR_SOLANA_BACKFILL_URL: ${MEMERADAR_SOLANA_BACKFILL_URL:-}
      SOLANA_STREAM_URL: ${SOLANA_STREAM_URL:-}
      HELIUS_WEBSOCKET_URL: ${HELIUS_WEBSOCKET_URL:-}
      SOLANA_RPC_BACKFILL_URL: ${SOLANA_RPC_BACKFILL_URL:-}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-dexscreener}
      DEXSCREENER_API_URL: ${DEXSCREENER_API_URL:-https://api.dexscreener.com}
      DEXSCREENER_API_KEY: ${DEXSCREENER_API_KEY:-}
      DEXSCREENER_API_BASE_URL: ${DEXSCREENER_API_BASE_URL:-}
      BIRDEYE_API_URL: ${BIRDEYE_API_URL:-}
      BIRDEYE_API_KEY: ${BIRDEYE_API_KEY:-}
      PAPER_QUOTE_PROVIDER: ${PAPER_QUOTE_PROVIDER:-dexscreener}
      MEMERADAR_PAPER_QUOTE_URL: ${MEMERADAR_PAPER_QUOTE_URL:-}
      MEMERADAR_PAPER_QUOTE_API_KEY: ${MEMERADAR_PAPER_QUOTE_API_KEY:-}
      JUPITER_QUOTE_URL: ${JUPITER_QUOTE_URL:-}
      JUPITER_API_BASE_URL: ${JUPITER_API_BASE_URL:-}
      JUPITER_API_KEY: ${JUPITER_API_KEY:-}
      RUGCHECK_API_URL: ${RUGCHECK_API_URL:-}
      RUGCHECK_API_KEY: ${RUGCHECK_API_KEY:-}
      WALLET_INTELLIGENCE_PROVIDER: ${WALLET_INTELLIGENCE_PROVIDER:-local}
      EXTERNAL_WALLET_API_URL: ${EXTERNAL_WALLET_API_URL:-}
      EXTERNAL_WALLET_API_KEY: ${EXTERNAL_WALLET_API_KEY:-}
      SOCIAL_METADATA_PROVIDER: ${SOCIAL_METADATA_PROVIDER:-dexscreener}
      SOCIAL_API_URL: ${SOCIAL_API_URL:-}
      SOCIAL_API_KEY: ${SOCIAL_API_KEY:-}
      NARRATIVE_PROVIDER: ${NARRATIVE_PROVIDER:-ollama}
      NARRATIVE_API_URL: ${NARRATIVE_API_URL:-http://host.docker.internal:11434}
      NARRATIVE_API_KEY: ${NARRATIVE_API_KEY:-}
      NARRATIVE_MODEL: ${NARRATIVE_MODEL:-}
      TELEGRAM_API_URL: ${TELEGRAM_API_URL:-https://api.telegram.org}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ALERT_MAX_MESSAGES_PER_WINDOW: ${ALERT_MAX_MESSAGES_PER_WINDOW:-20}
      ALERT_RATE_LIMIT_WINDOW_SECONDS: ${ALERT_RATE_LIMIT_WINDOW_SECONDS:-60}
      MADEONSOL_ENABLED: ${MADEONSOL_ENABLED:-false}
      MADEONSOL_API_KEY: ${MADEONSOL_API_KEY:-}
      MADEONSOL_BASE_URL: ${MADEONSOL_BASE_URL:-https://madeonsol.com/api/v1}
      GMGN_ENABLED: ${GMGN_ENABLED:-false}
      GMGN_API_KEY: ${GMGN_API_KEY:-}
      GMGN_BASE_URL: ${GMGN_BASE_URL:-https://openapi.gmgn.ai}
      ANALYSIS_ONLY: "true"
      PAPER_TRADING: "true"
      MANUAL_EXECUTION: "false"
      AUTO_EXECUTION: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${API_HOST_PORT:-18000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://memeradar:${POSTGRES_PASSWORD:-memeradar_local_only}@postgres:5432/memeradar}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REQUIRE_DATABASE_FOR_READINESS: ${REQUIRE_DATABASE_FOR_READINESS:-true}
      REQUIRE_REDIS_FOR_READINESS: ${REQUIRE_REDIS_FOR_READINESS:-true}
      ENABLED_CHAINS: ${ENABLED_CHAINS:-solana,robinhood}
      BNB_RPC_URL: ${BNB_RPC_URL:-}
      BNB_RPC_FALLBACK_URL: ${BNB_RPC_FALLBACK_URL:-}
      BNB_CHAIN_ID: ${BNB_CHAIN_ID:-56}
      ROBINHOOD_RPC_URL: ${ROBINHOOD_RPC_URL:-https://rpc.mainnet.chain.robinhood.com}
      ROBINHOOD_RPC_FALLBACK_URL: ${ROBINHOOD_RPC_FALLBACK_URL:-}
      ROBINHOOD_CHAIN_ID: ${ROBINHOOD_CHAIN_ID:-4663}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.mainnet.solana.com}
      HELIUS_RPC_URL: ${HELIUS_RPC_URL:-}
      HELIUS_API_KEY: ${HELIUS_API_KEY:-}
      MEMERADAR_SOLANA_STREAM_URL: ${MEMERADAR_SOLANA_STREAM_URL:-}
      MEMERADAR_SOLANA_BACKFILL_URL: ${MEMERADAR_SOLANA_BACKFILL_URL:-}
      SOLANA_STREAM_URL: ${SOLANA_STREAM_URL:-}
      HELIUS_WEBSOCKET_URL: ${HELIUS_WEBSOCKET_URL:-}
      SOLANA_RPC_BACKFILL_URL: ${SOLANA_RPC_BACKFILL_URL:-}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-dexscreener}
      DEXSCREENER_API_URL: ${DEXSCREENER_API_URL:-https://api.dexscreener.com}
      DEXSCREENER_API_KEY: ${DEXSCREENER_API_KEY:-}
      DEXSCREENER_API_BASE_URL: ${DEXSCREENER_API_BASE_URL:-}
      BIRDEYE_API_URL: ${BIRDEYE_API_URL:-}
      BIRDEYE_API_KEY: ${BIRDEYE_API_KEY:-}
      PAPER_QUOTE_PROVIDER: ${PAPER_QUOTE_PROVIDER:-dexscreener}
      MEMERADAR_PAPER_QUOTE_URL: ${MEMERADAR_PAPER_QUOTE_URL:-}
      MEMERADAR_PAPER_QUOTE_API_KEY: ${MEMERADAR_PAPER_QUOTE_API_KEY:-}
      JUPITER_QUOTE_URL: ${JUPITER_QUOTE_URL:-}
      JUPITER_API_BASE_URL: ${JUPITER_API_BASE_URL:-}
      JUPITER_API_KEY: ${JUPITER_API_KEY:-}
      RUGCHECK_API_URL: ${RUGCHECK_API_URL:-}
      RUGCHECK_API_KEY: ${RUGCHECK_API_KEY:-}
      WALLET_INTELLIGENCE_PROVIDER: ${WALLET_INTELLIGENCE_PROVIDER:-local}
      EXTERNAL_WALLET_API_URL: ${EXTERNAL_WALLET_API_URL:-}
      EXTERNAL_WALLET_API_KEY: ${EXTERNAL_WALLET_API_KEY:-}
      SOCIAL_METADATA_PROVIDER: ${SOCIAL_METADATA_PROVIDER:-dexscreener}
      SOCIAL_API_URL: ${SOCIAL_API_URL:-}
      SOCIAL_API_KEY: ${SOCIAL_API_KEY:-}
      NARRATIVE_PROVIDER: ${NARRATIVE_PROVIDER:-ollama}
      NARRATIVE_API_URL: ${NARRATIVE_API_URL:-http://host.docker.internal:11434}
      NARRATIVE_API_KEY: ${NARRATIVE_API_KEY:-}
      NARRATIVE_MODEL: ${NARRATIVE_MODEL:-}
      TELEGRAM_API_URL: ${TELEGRAM_API_URL:-https://api.telegram.org}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ALERT_MAX_MESSAGES_PER_WINDOW: ${ALERT_MAX_MESSAGES_PER_WINDOW:-20}
      ALERT_RATE_LIMIT_WINDOW_SECONDS: ${ALERT_RATE_LIMIT_WINDOW_SECONDS:-60}
      MADEONSOL_ENABLED: ${MADEONSOL_ENABLED:-false}
      MADEONSOL_API_KEY: ${MADEONSOL_API_KEY:-}
      MADEONSOL_BASE_URL: ${MADEONSOL_BASE_URL:-https://madeonsol.com/api/v1}
      GMGN_ENABLED: ${GMGN_ENABLED:-false}
      GMGN_API_KEY: ${GMGN_API_KEY:-}
      GMGN_BASE_URL: ${GMGN_BASE_URL:-https://openapi.gmgn.ai}
      ANALYSIS_ONLY: "true"
      PAPER_TRADING: "true"
      MANUAL_EXECUTION: "false"
      AUTO_EXECUTION: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_HOST_PORT:-18000}
      MEMERADAR_API_BASE_URL: ${MEMERADAR_API_BASE_URL:-http://api:8000}
      MEMERADAR_VIEWER_API_TOKEN: ${MEMERADAR_VIEWER_API_TOKEN:-${VIEWER_API_TOKEN:-}}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-13000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
