services:
  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-memeradar}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required for production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required for production}

  api:
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required for production}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required for production}
      REQUIRE_DATABASE_FOR_READINESS: "true"
      REQUIRE_REDIS_FOR_READINESS: "true"
      ENABLED_CHAINS: ${ENABLED_CHAINS:-solana,robinhood}
      VIEWER_API_TOKEN: ${VIEWER_API_TOKEN:?VIEWER_API_TOKEN is required for production}
      OPERATOR_API_TOKEN: ${OPERATOR_API_TOKEN:?OPERATOR_API_TOKEN is required for production}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?ADMIN_API_TOKEN is required for production}
      ANALYSIS_ONLY: "true"
      PAPER_TRADING: "true"
      MANUAL_EXECUTION: "false"
      AUTO_EXECUTION: "false"

  worker:
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required for production}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required for production}
      REQUIRE_DATABASE_FOR_READINESS: "true"
      REQUIRE_REDIS_FOR_READINESS: "true"
      ENABLED_CHAINS: ${ENABLED_CHAINS:-solana,robinhood}
      ANALYSIS_ONLY: "true"
      PAPER_TRADING: "true"
      MANUAL_EXECUTION: "false"
      AUTO_EXECUTION: "false"

  web:
    environment:
      MEMERADAR_API_BASE_URL: ${MEMERADAR_API_BASE_URL:?MEMERADAR_API_BASE_URL is required for production}
      MEMERADAR_VIEWER_API_TOKEN: ${VIEWER_API_TOKEN:?VIEWER_API_TOKEN is required for production}
