name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Lint
        run: python -m ruff check apps packages tests scripts
      - name: Typecheck
        run: python -m mypy
      - name: Test
        run: python -m pytest -q --cov=apps --cov=packages --cov-report=term-missing
      - name: Migration check
        run: make migration-check PYTHON=python3

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit test
        run: npm run test
      - name: Production build
        run: npm run build

  compose:
    name: Compose contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose -f infra/compose/docker-compose.yml config --quiet

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Scan tracked files
        run: python3 scripts/secret_scan.py
